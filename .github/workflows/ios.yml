name: Build iOS app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -project AppSculptor.xcodeproj -scheme AppSculptor -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build.log | sort -u | head -80
          if [ $status -ne 0 ]; then tail -60 build.log; fi
          exit $status

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AppSculptor.app Payload/
          zip -qry AppSculptor.ipa Payload
          ls -lh AppSculptor.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AppSculptor-ipa
          path: ios/AppSculptor.ipa

      - name: Publish to the "latest-ipa" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-ipa --yes --cleanup-tag || true
          gh release create latest-ipa AppSculptor.ipa --target "$GITHUB_SHA" --prerelease \
            --title "AppSculptor (latest build)" \
            --notes "Unsigned build from ${GITHUB_SHA::7}. Sideload with Sideloadly or AltStore, which sign it with your Apple ID."
